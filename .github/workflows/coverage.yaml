# Caller for pedrobtz/r-actions, copied from its examples/coverage.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Weekly on main, in azr's Saturday slot, rather than on every push to it,
  # and on demand; the badge follows.
  schedule:
    - cron: "23 1 * * 6"
  workflow_dispatch:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Decided without a runner.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:coverage'))
    # Pinned to a commit rather than @v1 because this job holds a write token.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@981302e34a9df42b165152f20b96a65c869b5c52 # v1.35.0
    permissions:
      contents: write
    with:
      # main takes no direct pushes (its ruleset requires pull requests), so
      # the badge goes to gh-pages, beside the pkgdown site, whose deploy
      # neither force-pushes nor cleans.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
