# Caller for pedrobtz/r-actions, copied from its examples/coverage.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Weekly on main, in azr's Saturday slot, rather than on every push to it,
  # and on demand; the badge follows.
  schedule:
    - cron: "23 1 * * 6"
  workflow_dispatch:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Decided without a runner.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:coverage'))
    # Pinned to a commit rather than @v1 because this job holds a write token:
    # it commits the badge. From v1.41.0 the badge goes to badges/coverage.svg
    # on gh-pages by default, beside the pkgdown site.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@af3de72ac23bc0776ded7c934d84e03d3a406a46 # v1.41.0
    permissions:
      contents: write
