# Caller for pedrobtz/r-actions, copied from its examples/r-cmd-check.yml.
on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again. Main is checked by the
  # schedule below, which skips a commit it has already checked.
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run R-CMD-check.yaml --ref main`.
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests. Full on the weekly schedule, on a manual
      # dispatch, and on a pull request labelled `full-ci`.
      profile: auto
